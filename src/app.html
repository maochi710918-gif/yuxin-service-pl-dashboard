<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服務部經營戰情</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f3;--surface:#ffffff;--surface-2:#fafaf8;--line:#e6e5e0;--line-2:#d6d5cf;
  --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#8a8983;
  --accent:#2a78d6;--accent-soft:#e8f1fc;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --good:#0a7a33;--good-bg:#e6f4ea;--bad:#c62828;--bad-bg:#fdecea;--warn:#a15c00;--warn-bg:#fff4e0;
  --neutral:#f0efec;--div-neg:#e34948;--div-pos:#2a78d6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110;--surface:#1a1a19;--surface-2:#21211f;--line:#2e2e2b;--line-2:#3a3a36;
    --ink:#ffffff;--ink-2:#c3c2b7;--ink-3:#8e8d85;
    --accent:#3987e5;--accent-soft:#1d2b3d;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
    --good:#4cc36f;--good-bg:#15301d;--bad:#ff6b6b;--bad-bg:#3a1a1a;--warn:#f0a93b;--warn-bg:#35270f;
    --neutral:#383835;--div-neg:#e66767;--div-pos:#3987e5;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#21211f;--line:#2e2e2b;--line-2:#3a3a36;
  --ink:#ffffff;--ink-2:#c3c2b7;--ink-3:#8e8d85;
  --accent:#3987e5;--accent-soft:#1d2b3d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --good:#4cc36f;--good-bg:#15301d;--bad:#ff6b6b;--bad-bg:#3a1a1a;--warn:#f0a93b;--warn-bg:#35270f;
  --neutral:#383835;--div-neg:#e66767;--div-pos:#3987e5;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:14px;line-height:1.5}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav#side{background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:0 10px 4px}
.brand small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
nav#side a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;cursor:pointer}
nav#side a .no{color:var(--ink-3);font-size:11px;width:18px}
nav#side a:hover{background:var(--surface-2)}
nav#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav#side a.on .no{color:var(--accent)}
nav#side hr{border:0;border-top:1px solid var(--line);margin:10px 6px}
main{min-width:0}
#topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fg{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.fg select,.fg input{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ask{flex:1;min-width:220px;display:flex}
.ask input{flex:1;border:1px solid var(--line-2);border-radius:10px 0 0 10px;padding:7px 12px;background:var(--surface);font-size:13.5px}
.ask button{border-radius:0 10px 10px 0;border-left:0}
#brsel{position:relative}
#brpop{display:none;position:absolute;top:34px;left:0;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:40;width:300px}
#brpop.open{display:block}
#brpop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;margin:8px 0}
#brpop label{font-size:13px;display:flex;gap:4px;align-items:center;cursor:pointer}
#notice{width:100%;font-size:12px;color:var(--warn);display:none}
#page{padding:22px 24px 60px;max-width:1500px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:13px;margin-bottom:18px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13.5px;margin:0 0 6px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.mt{margin-top:14px}
.kpi{cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--accent)}
.kpi.hero{border:1.5px solid var(--s7);background:color-mix(in srgb,var(--s7) 6%,var(--surface))}
.kpi .l{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi .c{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.neu{background:var(--neutral);color:var(--ink-2)}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--ink-2)}
.tbl-wrap{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink-2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--surface);cursor:default}
th.sort{cursor:pointer}
th.sort:hover{color:var(--ink)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.lv0 td{font-weight:700;background:var(--surface-2)}
tr.lv1 td{font-weight:600}
.tw{display:inline-block;width:16px;color:var(--ink-3);cursor:pointer;user-select:none}
.chart{width:100%;height:300px}
.chart.tall{height:420px}
.chart.sm{height:220px}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--surface);overflow:auto;padding:20px 22px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer.full .panel{width:min(1180px,100%)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;margin-bottom:12px;color:var(--ink-3)}
.crumb a{cursor:pointer;text-decoration:none}
.crumb span.sep{color:var(--ink-3)}
.x{position:sticky;top:0;float:right;border:0;background:var(--surface-2);border-radius:99px;width:30px;height:30px;cursor:pointer;font-size:16px}
.bar-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 110px 90px;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .track{height:10px;background:var(--neutral);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:99px}
.bar-row .fill.neg{background:var(--s8)}
.ai{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.ai h4{margin:12px 0 4px;font-size:13px;color:var(--accent)}
.ai p,.ai li{margin:2px 0;font-size:13.5px}
.ai ul{margin:2px 0;padding-left:18px}
.qa{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qa .q{font-weight:650}
.qa .i{width:24px;height:24px;border-radius:99px;background:var(--ink);color:var(--surface);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.muted{color:var(--ink-3);font-size:12px}
.pill-in{width:80px;border:1px solid var(--line-2);border-radius:8px;padding:4px 8px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.heat td.n{font-size:12px}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px}
.toggle-theme{margin-left:auto}
.board h2{margin-top:18px}
.board .item{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.board .item .i{font-weight:800;color:var(--accent);font-size:18px}
#menuBtn{display:none}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  nav#side{position:fixed;z-index:70;left:0;top:0;width:250px;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px rgba(0,0,0,.2)}
  nav#side.open{transform:none}
  #menuBtn{display:inline-block}
  #topbar{padding:10px 16px}
  #page{padding:16px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g6{grid-template-columns:repeat(2,1fr)}
  .span2{grid-column:auto}
  .kpi .v{font-size:22px}
  .bar-row{grid-template-columns:minmax(90px,1fr) 70px 80px;}
  .bar-row .track{display:none}
}
@media print{nav#side,#topbar{display:none}#app{display:block}.drawer .panel{position:static;width:100%;box-shadow:none}.drawer .mask,.x{display:none}}
</style>
</head>
<body>
<div id="app">
<nav id="side">
  <div class="brand">服務部經營戰情<small>損益 × 費用穿透 × 廠別分析</small></div>
  <hr>
  <div id="navlist"></div>
</nav>
<main>
  <div id="topbar">
    <button class="btn" id="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
    <div class="fg">年度 <select id="fYear"><option value="2026">2026</option><option value="2025">2025</option></select></div>
    <div class="fg">期間
      <select id="fM0"></select>–<select id="fM1"></select>
      <span class="seg" id="quick"></span>
    </div>
    <div class="fg" id="brsel">廠別 <button class="btn" id="brbtn">全部</button>
      <div id="brpop">
        <div style="display:flex;gap:6px"><button class="btn" data-a="all">全部（含本部）</button><button class="btn" data-a="br">全部單位</button><button class="btn" data-a="none">清除</button></div>
        <div class="grid" id="brgrid"></div>
        <div style="text-align:right"><button class="btn pri" id="brok">套用</button></div>
      </div>
    </div>
    <div class="fg">比較基準 <select id="fBase">
      <option value="a25">去年同期（2025 實際）</option>
      <option value="b26">26年預算（均攤）</option>
      <option value="prev">上期（實際）</option>
      <option value="avg">服務廠平均（實際）</option>
    </select></div>
    <label class="fg" title="YoY 只比較兩年同月份都在營運的單位（承德、淡水、大安、民權、濱江、北投 2025/9、撫遠鈑噴 2025/10 併入）"><input type="checkbox" id="fSS"> 同店比較（建議）</label>
    <button class="btn pri" onclick="boardMode()">董事會模式</button>
    <button class="btn" onclick="plantMode()">廠長模式</button>
    <div class="ask"><input id="askIn" placeholder="直接問我的損益：例如「哪些廠業務貢獻率(邊貢率)最低？」"><button class="btn" onclick="ask()">問</button></div>
    <button class="btn toggle-theme" id="themeBtn" title="切換深淺色">◐</button>
    <div id="notice"></div>
  </div>
  <div id="page"></div>
</main>
</div>
<div class="drawer" id="drawer"><div class="mask" onclick="closeDrawer()"></div><div class="panel" id="dpanel"></div></div>

<script>
const D = /*__DATA__*/null;
/* ================= 基礎 ================= */
let NM=D.meta.months; const ENT=D.meta.ent, BR=D.meta.br, HQ=D.meta.hq, HQI=ENT.indexOf(HQ);
const TYP=D.meta.type||BR.map(()=>'服務廠'), isBP=i=>TYP[i]==='鈑噴中心', SVCI=BR.map((_,i)=>i).filter(i=>!isBP(i)), bn=x=>/鈑噴/.test(x)?x:x+'廠';
const wavg=(bs,k)=>{const f=bs.filter(x=>!isBP(x.i)); return f.reduce((s,x)=>s+x[k],0)/(f.reduce((s,x)=>s+x.rev,0)||1);};
const bpTag=i=>isBP(i)?' <span class="tag neu">鈑噴中心</span>':'';
const A=D.acc, byCode={}, kids={};
A.forEach(a=>{ if(a.c==='90') a.n='零服業務貢獻(邊貢)'; if(!(a.c in byCode)) byCode[a.c]=a; if(a.p!=null)(kids[a.p]=kids[a.p]||[]).push(a.id); });
const MN=m=>m+'月';
const S={m0:1,m1:NM,ents:null,base:'a25',page:'ceo',ss:true,yr:2026};
try{const s=JSON.parse(localStorage.getItem('svcdash-state')||'{}'); if(s.page)S.page=s.page; if(s.base)S.base=s.base; if(s.ss2!==undefined)S.ss=!!s.ss2;}catch(e){}

const LINES=[
 {k:'rev',c:'100',n:'零服營收',s:1,top:1},
 {k:'cogs',c:'110',n:'零服成本',s:-1},
 {k:'gp',c:'120',n:'零服毛利',s:1,top:1},
 {k:'bonus',c:'130',n:'零服獎金（原廠補助）',s:1},
 {k:'ext',c:'140',n:'零服外促費用（廣促）',s:-1},
 {k:'int',c:'150',n:'零服內促費用（績效獎金）',s:-1},
 {k:'fix',c:'160',n:'服務廠固定薪資',s:-1},
 {k:'contrib',c:'90',n:'零服業務貢獻(邊貢)',s:1,top:1},
 {k:'peri',c:'170',n:'週邊業務貢獻',s:1},
 {k:'opx',c:'490',n:'費用（資產使用／間接人事／事務）',s:-1},
 {k:'op',c:'500',n:'營業利益',s:1,top:1},
 {k:'nonop',c:'510',n:'業外淨收入',s:1},
 {k:'pbt',c:'520',n:'稅前淨利',s:1,top:1}];
const CATS=[
 {k:'hr',n:'人事',codes:['150','160','49020']},
 {k:'promo',n:'廣促／外促',codes:['140']},
 {k:'out',n:'外包／加工',codes:['510707','510708']},
 {k:'mat',n:'耗材／漆料',codes:['510701','510702']},
 {k:'util',n:'水電瓦斯',codes:['510704']},
 {k:'rent',n:'租金',codes:['4901010']},
 {k:'dep',n:'折舊攤提',codes:['4901020']},
 {k:'rep',n:'修繕／保險／雜購',codes:['4901030']},
 {k:'adm',n:'事務（刷卡費／雜支／郵電…）',codes:['49030']}];
function leaves(id){const k=kids[id]; if(!k||!k.length) return [id]; return k.flatMap(leaves);}
CATS.forEach(c=>{c.ids=c.codes.filter(x=>byCode[x]).map(x=>byCode[x].id); c.leaves=c.ids.flatMap(leaves);});
const EXP_LEAVES=CATS.flatMap(c=>c.leaves.map(id=>({id,cat:c})));
const leafCat={}; EXP_LEAVES.forEach(o=>leafCat[o.id]=o.cat);
/* ---------- 傳票明細（2601-08費用表：總帳全部科目） ---------- */
const GLX=D.exp, GLS=GLX.s;
const GL=GLX.rows.map(r=>{ const o={}; GLX.f.forEach((k,j)=>o[k]=r[j]); ['code','acn','ou','s','v','c1','c2','cc'].forEach(k=>o[k]=GLS[o[k]]); o.b=o.e>=0?ENT[o.e]:(o.ou||'範圍外'); o.t=o.acn.replace(/^廣促費_/,'').replace(/（傳票科目.*$/,''); return o; });
const lineOf=a=>{ let p=a; while(p){ const l=LINES.find(x=>x.c===p.c); if(l) return l.n; p=p.p!=null?A[p.p]:null; } return '其他'; };
GL.forEach(x=>{ if(!x.c1){ const a=byCode[x.code]; const cat=a&&leafCat[a.id]; x.c1=cat?cat.n:(a?lineOf(a):'損益表無此科目'); x.c2=a?a.n.replace(/^[^_]*_/,''):x.t; } });
GL.forEach(x=>{ if(!x.y) x.y=2026; });
D.exp=GL.filter(x=>x.e>=0&&x.y===2026); D.exp25=GL.filter(x=>x.e>=0&&x.y===2025);
const isPromo=x=>x.code==='61179910'||x.code==='61179918';
let PROMO=D.exp.filter(isPromo), PROMO25=D.exp25.filter(isPromo);
const inC=(x,c)=>x.m>=c.m0&&x.m<=c.m1&&c.ents.includes(x.e);
const isExpRow=x=>{ const a=byCode[x.code]; return !!(a&&leafCat[a.id]); };
const normS=t=>String(t).replace(/1[01]\d\s*年/g,'').replace(/(^|[^\d])1[01]\d(?=[\/.\-]|Q|\d{2}月)/g,'$1').replace(/\d{1,2}[\/.]\d{1,2}(月)?/g,'').replace(/\d{1,2}月份?/g,'').replace(/^[\s\/.\-]+/,'').trim();
const buildRecur=()=>{ const mm={}; D.exp.forEach(x=>{ const k=x.e+'|'+x.code+'|'+normS(x.s); (mm[k]=mm[k]||new Set()).add(x.m); if(x.v){ const kv=x.e+'|'+x.code+'|V:'+x.v.slice(0,2); (mm[kv]=mm[kv]||new Set()).add(x.m); } }); return new Set(Object.entries(mm).filter(([k,v])=>v.size>=4).map(([k])=>k)); };
let RECUR=buildRecur();
const catOfRow=x=>{ const a=byCode[x.code]; return a?leafCat[a.id]:null; };
let OVR={}; try{OVR=JSON.parse(localStorage.getItem('svcdash-ovr-gl')||'{}')}catch(e){}
GL.forEach(x=>{ if(OVR[x.i]){x.c1=OVR[x.i][0];x.c2=OVR[x.i][1];} });

/* ---------- 年度切換（2026 ↔ 2025） ---------- */
A.forEach(a=>{ a.v26=a.v; a.py25=a.py; }); Object.values(D.kpi).forEach(k=>{ k.svc26=k.svc; k.br26=k.br; k.py25=k.py; });
function setYear(y){ S.yr=y; const is25=y===2025;
  A.forEach(a=>{ a.v=is25?(a.py25||a.v26.map(r=>r.map(()=>0))):a.v26; a.py=is25?null:a.py25; });

const BASE_LABEL={a25:'去年同期',b26:'26預算(均攤)',prev:'上期',avg:'服務廠平均',none:'無比較基準'};
function baseA(a,c,b){
  if(typeof a==='string') a=byCode[a]; if(!a) return 0;

  if(b==='a25') return sumA(a,{...c,ents:c.cmp||c.ents,py:true});
  if(b==='none') return NaN;

  if(b==='prev') return sumA(a,{...c,m0:c.m0-c.n,m1:c.m0-1});
  if(b==='avg'){ const t=sumA(a,{...c,ents:SVCI}); return t/SVCI.length*c.ents.filter(e=>e!==HQI).length; }

const P=(x,d=1)=>x==null||!isFinite(x)?'—':(x*100).toFixed(d)+'%';
const SP=(x,d=1)=>x==null||!isFinite(x)?'—':(x>=0?'+':'')+(x*100).toFixed(d)+'%';
const SW=x=>(x>=0?'+':'−')+W(Math.abs(x));
const pp=x=>x==null||!isFinite(x)?'—':(x>=0?'+':'')+(x*100).toFixed(1)+' pp';

function dTag(cur,base,sign=1,asPP=false){ // sign 1 = 越高越好

  const d=asPP?cur-base:gr(cur,base); if(d==null||!isFinite(d)) return '<span class="tag neu">—</span>';
  const good=d*sign>=0; const txt=asPP?pp(d):SP(d);

}

function pl(c){ const o={}; LINES.forEach(l=>o[l.k]=V(l.c,c)); o.exp=expTot(c); o.gm=ratio(o.gp,o.rev); o.cr=ratio(o.contrib,o.rev); o.opm=ratio(o.op,o.rev); o.er=ratio(o.exp,o.rev); return o;}

function bridge(c,b,t='op'){ c=cmpC(c);

/* 異常雷達 */
function anomalies(c,th){
  th=th||{pct:.2,amt:100000,pp:.02};
  const out=[]; const EA=c.entsAll||c.ents; const ents=EA.filter(e=>e!==HQI);
  const accs=EXP_LEAVES.map(o=>A[o.id]);
  for(const e of EA){
    for(const a of accs){
      const r=a.v[e]; const vals=r.slice(0,NM);
      for(let m=Math.max(c.m0,2);m<=c.m1;m++){
        const v=vals[m-1], pv=vals[m-2];
        const others=vals.filter((_,k)=>k!==m-1); const avg=others.reduce((s,x)=>s+x,0)/others.length;
        if(v-pv>th.amt && pv>0 && (v-pv)/pv>th.pct) out.push({t:'單月費用突增',e,m,a,v,base:pv,d:v-pv,why:`較上月 ${SP((v-pv)/pv)}`});
        else if(v-avg>th.amt && avg>0 && (v-avg)/avg>th.pct) out.push({t:'遠高於平均',e,m,a,v,base:avg,d:v-avg,why:`較其他月份平均 ${SP((v-avg)/avg)}`});
        if(m>=4 && vals[m-1]>vals[m-2]&&vals[m-2]>vals[m-3]&&vals[m-3]>vals[m-4] && v-vals[m-4]>th.amt) out.push({t:'連續3月增加',e,m,a,v,base:vals[m-4],d:v-vals[m-4],why:`${m-3}→${m}月連續上升`});
      }
    }
  }
  // 較去年同月大增
  if(hasPY(c)) for(const e of (c.entsAll||c.ents)){ for(const a of accs){ if(!a.py) continue; for(let m=c.m0;m<=c.m1;m++){ const v=a.v[e][m-1], pv=a.py[e][m-1]; if(pv>0&&v-pv>th.amt&&(v-pv)/pv>th.pct) out.push({t:'較去年同月大增',e,m,a,v,base:pv,d:v-pv,why:`2025/${m} ${W(pv)} 萬 → ${W(v)} 萬（${SP((v-pv)/pv)}）`}); } } }
  // 費用率 vs 廠平均
  const bs=branchStats(c); const avgEr=wavg(bs,'exp');
  bs.forEach(x=>{ if(!(c.entsAll||c.ents).includes(x.i)||x.closed||isBP(x.i)) return; if(x.er-avgEr>th.pp) out.push({t:'費用率高於廠平均',e:x.i,m:null,a:null,v:x.exp,base:avgEr*x.rev,d:x.exp-avgEr*x.rev,why:`費用率 ${P(x.er)} vs 廠平均 ${P(avgEr)}（${pp(x.er-avgEr)}）`}); });
  // 營收↓ 費用↑ (月對月)
  for(const e of ents){ for(let m=Math.max(c.m0,2);m<=c.m1;m++){ const cc={...c,ents:[e]}; const a1=pl({...cc,m0:m,m1:m}), a0=pl({...cc,m0:m-1,m1:m-1});
    if(a1.rev<a0.rev && a1.exp-a0.exp>th.amt) out.push({t:'營收下降但費用增加',e,m,a:null,v:a1.exp,base:a0.exp,d:a1.exp-a0.exp,why:`營收 ${SP(gr(a1.rev,a0.rev))}，費用 ${SW(a1.exp-a0.exp)} 萬`});
    if(a1.rev>a0.rev && a1.contrib<a0.contrib && a0.contrib-a1.contrib>th.amt) out.push({t:'營收增加但業務貢獻(邊貢)下降',e,m,a:null,v:a1.contrib,base:a0.contrib,d:a0.contrib-a1.contrib,why:`營收 ${SP(gr(a1.rev,a0.rev))}，業務貢獻(邊貢) ${SW(a1.contrib-a0.contrib)} 萬（邊貢率 ${P(a1.cr)} vs ${P(a0.cr)}）`});
    if(a1.rev>a0.rev && a1.op<a0.op && a0.op-a1.op>th.amt) out.push({t:'營收增加但利益下降',e,m,a:null,v:a1.op,base:a0.op,d:a0.op-a1.op,why:`營收 ${SP(gr(a1.rev,a0.rev))}，營業利益 ${SW(a1.op-a0.op)} 萬`});
  }}
  // 大額單筆 & 重複摘要
  const SKIPK=new Set(['hr','rent','dep']);
  const ex=D.exp.filter(x=>x.m>=c.m0&&x.m<=c.m1&&(c.entsAll||c.ents).includes(x.e)&&isExpRow(x)&&!SKIPK.has(catOfRow(x).k));
  ex.forEach(x=>{ if(x.a>th.amt && x.c2!=='各項優惠券(系統)' && !RECUR.has(x.e+'|'+x.code+'|'+normS(x.s)) && !(x.v&&RECUR.has(x.e+'|'+x.code+'|V:'+x.v.slice(0,2)))) out.push({t:'特殊大額支出',e:x.e,m:x.m,a:byCode[x.code],v:x.a,base:0,d:x.a,why:esc(x.s)+(x.v?`（${esc(x.v)}）`:'')+`｜傳票 ${x.vno}`,raw:x}); });
  const g={}; ex.forEach(x=>{ if(x.c2==='各項優惠券(系統)'||x.a<5000) return; const k=x.e+'|'+x.m+'|'+x.code+'|'+x.s+'|'+x.a; (g[k]=g[k]||[]).push(x); });
  Object.values(g).forEach(arr=>{ if(arr.length>=2){ const s=arr.reduce((t,x)=>t+x.a,0); out.push({t:'同摘要同金額重複入帳',e:arr[0].e,m:arr[0].m,a:byCode[arr[0].code],v:s,base:arr[0].a,d:s-arr[0].a,why:`「${esc(arr[0].s)}」${Y(arr[0].a)} 元出現 ${arr.length} 次（傳票 ${[...new Set(arr.map(x=>x.vno))].join('、')}）`,raw:arr[0]}); } });
  return out.sort((x,y)=>y.d-x.d);
}

function topSources(c,k=5){
  const out=[];
  for(const e of (c.entsAll||c.ents)) for(const o of EXP_LEAVES){ const r=A[o.id].v[e]; const avg=r.reduce((s,x)=>s+x,0)/NM;

  return out.sort((a,b)=>b.d-a.d).slice(0,k);
}

}

function buildNav(){ document.getElementById('navlist').innerHTML=PAGES.map((p,i)=>`${p[0]==='hr'?'<hr><div class="muted" style="padding:0 10px 4px">獨立模組</div>':''}<a data-p="${p[0]}" class="${S.page===p[0]?'on':''}"><span class="no">${String(i+1).padStart(2,'0')}</span>${p[1]}</a>`).join('');
  document.querySelectorAll('#navlist a').forEach(a=>a.onclick=()=>{S.page=a.dataset.p; document.getElementById('side').classList.remove('open'); render();}); }

function buildFilters(){
  const o=Array.from({length:NM},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');
  fM0.innerHTML=o; fM1.innerHTML=o; fM0.value=S.m0; fM1.value=S.m1; fBase.value=S.base;
  fM0.onchange=()=>{S.m0=+fM0.value; if(S.m1<S.m0){S.m1=S.m0;fM1.value=S.m1;} render();};
  fM1.onchange=()=>{S.m1=+fM1.value; if(S.m0>S.m1){S.m0=S.m1;fM0.value=S.m0;} render();};
  fBase.onchange=()=>{S.base=fBase.value; render();};
  fYear.value=String(S.yr); fYear.onchange=()=>{ setYear(+fYear.value); const o2=Array.from({length:NM},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join(''); fM0.innerHTML=o2; fM1.innerHTML=o2; fM0.value=S.m0; fM1.value=S.m1; render(); };
  fSS.checked=!!S.ss; fSS.onchange=()=>{S.ss=fSS.checked; render();};
  const Q=[['單月',()=>[NM,NM]],['Q1',()=>[1,3]],['Q2',()=>[4,6]],['H1',()=>[1,6]],['YTD',()=>[1,NM]]];
  quick.innerHTML=Q.map((q,i)=>`<button data-i="${i}">${q[0]}</button>`).join('');
  quick.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [a,z]=Q[+b.dataset.i][1](); S.m0=a;S.m1=z;fM0.value=a;fM1.value=z;render();});
  brgrid.innerHTML=ENT.map((e,i)=>`<label><input type="checkbox" value="${i}">${e===HQ?'本部':e}</label>`).join('');
  brbtn.onclick=e=>{e.stopPropagation(); const set=S.ents||allEnts(); brgrid.querySelectorAll('input').forEach(x=>x.checked=set.includes(+x.value)); brpop.classList.toggle('open');};
  brpop.onclick=e=>e.stopPropagation(); document.addEventListener('click',()=>brpop.classList.remove('open'));
  brpop.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a; brgrid.querySelectorAll('input').forEach(x=>x.checked=a==='all'||(a==='br'&&+x.value!==HQI));});
  brok.onclick=()=>{const v=[...brgrid.querySelectorAll('input:checked')].map(x=>+x.value); S.ents=(v.length===0||v.length===ENT.length)?null:v; brpop.classList.remove('open'); render();};
  themeBtn.onclick=()=>{const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; render();};
  askIn.onkeydown=e=>{if(e.key==='Enter')ask();};
}
function syncTop(){
  const c=ctx(); brbtn.textContent=entsLabel(c);
  quick.querySelectorAll('button').forEach((b,i)=>{const r=[[NM,NM],[1,3],[4,6],[1,6],[1,NM]][i]; b.classList.toggle('on',S.m0===r[0]&&S.m1===r[1]);});
  const {note}=effBase(c); notice.style.display=note?'block':'none'; notice.textContent=note?'⚠ '+note:'';
  [...fBase.options].forEach(o=>o.disabled=S.yr===2025&&(o.value==='a25'||o.value==='b26')); fSS.disabled=S.yr===2025;

function render(){
  charts.forEach(c=>c.dispose()); charts=[];
  try{localStorage.setItem('svcdash-state',JSON.stringify({page:S.page,base:S.base,ss2:S.ss,yr:S.yr}))}catch(e){}

/* ================= Drill-down 引擎 ================= */
let DSTACK=[];
function openDrill(node,reset=true){ if(reset) DSTACK=[]; DSTACK.push(node); drawDrill(); drawer.classList.add('open'); drawer.classList.remove('full'); }
function closeDrawer(){ drawer.classList.remove('open'); }
function drawDrill(){
  const node=DSTACK[DSTACK.length-1]; const res=node.build();
  dpanel.innerHTML=`<button class="x" onclick="closeDrawer()">×</button>
   <div class="crumb">${DSTACK.map((n,i)=>i<DSTACK.length-1?`<a onclick="DSTACK.length=${i+1};drawDrill()">${esc(n.title)}</a><span class="sep">›</span>`:`<b>${esc(n.title)}</b>`).join('')}</div>
   <h2>${esc(node.title)}</h2><div class="muted" style="margin-bottom:10px">${res.sub||''}</div>${res.html}`;
  (res.rows||[]).forEach((r,i)=>{ const el=dpanel.querySelector(`[data-dr="${i}"]`); if(el&&r.next) el.onclick=()=>{DSTACK.push(r.next()); drawDrill();}; });
  res.after&&res.after();
}
function barList(rows,opt={}){
  const max=Math.max(...rows.map(r=>Math.abs(r.v)),1);
  return rows.map((r,i)=>`<div class="bar-row" data-dr="${i}" ${r.next?'':'style="cursor:default"'}>
    <div>${esc(r.label)}${r.next?' <span class="muted">›</span>':''}</div>
    <div class="track"><div class="fill ${r.v<0?'neg':''}" style="width:${Math.abs(r.v)/max*100}%"></div></div>
    <div class="num" style="text-align:right">${Wu(r.v)}</div>
    <div style="text-align:right">${r.tag||''}</div></div>`).join('');
}
/* metric = {label, f(c), sign} */
const METRICS={
  rev:{label:'零服營收',f:c=>V('100',c),s:1},
  gp:{label:'零服毛利',f:c=>V('120',c),s:1},
  contrib:{label:'零服業務貢獻(邊貢)',f:c=>V('90',c),s:1},
  op:{label:'營業利益',f:c=>V('500',c),s:1},
  exp:{label:'總費用',f:c=>expTot(c),s:-1},
};
function nodeMonths(mk){ const M=METRICS[mk]; return {title:`${M.label}｜月份`,build(){
  const c=ctx(); const vals=months(c).map(m=>({m,v:M.f({...c,m0:m,m1:m})})); const avg=vals.reduce((s,x)=>s+x.v,0)/vals.length;
  const rows=vals.map(x=>({label:`${x.m}月`,v:x.v,tag:dTag(x.v,avg,M.s),next:()=>nodeBranches(mk,x.m,x.m)}));
  return {sub:`${entsLabel(c)}｜與期間月平均 ${Wu(avg)} 比較｜點月份看各廠`,html:barList(rows),rows};}};}
function nodeBranches(mk,m0,m1){ const M=METRICS[mk]; return {title:`${m0===m1?m0+'月':m0+'–'+m1+'月'}｜各廠`,build(){
  const c=ctxAll({m0,m1}); const vals=c.ents.map(e=>({e,v:M.f({...c,ents:[e]})})); const brv=vals.filter(x=>x.e!==HQI&&!isBP(x.e)); const avg=brv.reduce((s,x)=>s+x.v,0)/(brv.length||1);
  const sorted=vals.sort((a,b)=>M.s>0?a.v-b.v:b.v-a.v);
  const rows=sorted.map(x=>({label:entName(x.e),v:x.v,tag:x.e===HQI?'<span class="tag neu">本部</span>':dTag(x.v,avg,M.s),next:()=>nodeLines([x.e],m0,m1)}));
  return {sub:`依${M.s>0?'由低到高':'由高到低'}排序（最需關注在上）｜與服務廠平均 ${Wu(avg)} 比較｜點廠別看損益結構`,html:barList(rows),rows};}};}
function nodeLines(ents,m0,m1){ return {title:`${ents.length===1?entName(ents[0]):ents.length+'單位'}｜損益結構`,build(){
  const c=ctx({ents,m0,m1}); const single=ents.length===1&&ents[0]!==HQI;
  const other=m=>{ // 同廠其他月份平均 × 月數
    const r=[]; for(let k=1;k<=NM;k++) if(k<m0||k>m1) r.push(k); return r; };
  const oth=other(); const n=m1-m0+1;
  const rows=LINES.filter(l=>!['contrib','pbt','nonop','gp','op'].includes(l.k)).map(l=>{ const v=V(l.c,c);
    const bv=oth.length? oth.reduce((s,k)=>s+V(l.c,{...c,m0:k,m1:k}),0)/oth.length*n : null;
    return {label:l.n,v:v,tag:dTag(v,bv,l.s),next:()=>nodeAcct(byCode[l.c].id,ents,m0,m1)}; });
  const p=pl(c);
  return {sub:`營收 ${Wu(p.rev)}｜營業利益 ${Wu(p.op)}（${P(p.opm)}）｜標籤＝與同單位其他月份平均比較｜點科目往下`,html:barList(rows),rows};}};}
function nodeAcct(id,ents,m0,m1){ const a=A[id]; return {title:`${a.c} ${a.n}`,build(){
  const c=ctx({ents,m0,m1}); const k=(kids[id]||[]).filter(x=>A[x].v.some(r=>r.some(v=>v)));
  if(k.length){
    const rows=k.map(x=>({label:`${A[x].n}`,v:sumA(A[x],c),a:A[x]})).sort((p,q)=>Math.abs(q.v)-Math.abs(p.v))
      .map(r=>({...r,next:()=>nodeAcct(r.a.id,ents,m0,m1)}));
    return {sub:`${entsLabel(c)}｜${perLabel(c)}｜合計 ${Wu(sumA(a,c))}`,html:barList(rows),rows};
  }
  // 葉節點：若多廠→廠別；若多月→月份；否則原始
  const glN=D.exp.filter(x=>x.code===a.c&&x.m>=m0&&x.m<=m1&&ents.includes(x.e)).length;
  const rawRow={label:`📄 直接看全部原始傳票（${glN} 筆）`,v:sumA(a,c),next:()=>nodeRaw(a,ents,m0,m1)};
  if(ents.length>1){ const rows=[rawRow,...ents.map(e=>({label:entName(e),v:sumA(a,{...c,ents:[e]}),e})).sort((p,q)=>q.v-p.v).map(r=>({...r,next:()=>nodeAcct(id,[r.e],m0,m1)}))];
    return {sub:'明細科目｜依廠別展開',html:barList(rows),rows}; }
  if(m1>m0){ const rows=[rawRow,...months(c).map(m=>({label:m+'月',v:sumA(a,{...c,m0:m,m1:m}),next:()=>nodeAcct(id,ents,m,m)}))];
    return {sub:'明細科目｜依月份展開',html:barList(rows),rows}; }
  return nodeRaw(a,ents,m0,m1).build();
}};}
let RAWY=2026;
function glDiff(cur,prev,keyf){ const g={}; const add=(arr,k)=>arr.forEach(x=>{ const kk=keyf(x)||'（未標示）'; (g[kk]=g[kk]||{k:kk,c:0,p:0,nc:0,np:0}); g[kk][k]+=x.a; g[kk]['n'+k]++; }); add(cur,'c'); add(prev,'p'); return Object.values(g).map(o=>({...o,d:o.c-o.p})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)); }
function diffTable(rows,lab){ return `<div class="tbl-wrap"><table><thead><tr><th>${lab}</th><th class="n">今年</th><th class="n">去年同期</th><th class="n">差額</th><th class="n">YoY</th><th class="n">筆數（今/去）</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.k)}</td><td class="n">${Y(o.c)}</td><td class="n">${Y(o.p)}</td><td class="n ${o.d>0?'bad-t':'good-t'}">${o.d>=0?'+':''}${Y(o.d)}</td><td class="n">${o.p?SP(gr(o.c,o.p)):'新增'}</td><td class="n muted">${o.nc}／${o.np}</td></tr>`).join('')}</tbody></table></div>`; }
function nodeRaw(a,ents,m0,m1){ return {title:'原始傳票',build(){
  const ex=D.exp.filter(x=>x.code===a.c&&x.m>=m0&&x.m<=m1&&ents.includes(x.e)).sort((p,q)=>Math.abs(q.a)-Math.abs(p.a));
  const ex25=D.exp25.filter(x=>x.code===a.c&&x.m>=m0&&x.m<=m1&&ents.includes(x.e)).sort((p,q)=>Math.abs(q.a)-Math.abs(p.a));
  const pv=sumA(a,{ents,m0,m1}); const gv=ex.reduce((t,x)=>t+x.a,0); const diff=pv-gv;
  const note=Math.abs(diff)>1?`<div class="banner warn">⚠ 損益表 ${Y(pv)} 元，傳票明細合計 ${Y(gv)} 元，差額 ${Y(diff)} 元${ents.includes(HQI)?'（服務部本部含未入傳票明細的分攤數，只能部分追溯）':''}。數字不調整，請以損益表為準並查核差異。</div>`
    :`<div class="banner info">✓ 傳票明細合計 ${Y(gv)} 元 = 損益表金額</div>`;
  const pyOK=hasPY({m1})&&a.py; const ce=pyOK&&S.ss?ssEnts(ents,m0,m1):ents; const nw=ents.filter(e=>!ce.includes(e));
  const exC=ex.filter(x=>ce.includes(x.e)); const ex25c=ex25.filter(x=>ce.includes(x.e)); const gC=exC.reduce((t,x)=>t+x.a,0);
  const p25=pyOK?sumA(a,{ents:ce,m0,m1,py:true}):0; const g25=ex25c.reduce((t,x)=>t+x.a,0);
  const cmp=pyOK?`<div class="card"><h3>和去年同期比（${m0===m1?m0+'月':m0+'–'+m1+'月'}）</h3><p>${nw.length?'同店':''}今年 <b>${Y(gC)}</b> 元（${exC.length} 筆）｜去年同期 <b>${Y(g25)}</b> 元（${ex25c.length} 筆）｜差額 <b class="${gC-g25>0?'bad-t':'good-t'}">${gC-g25>=0?'+':''}${Y(gC-g25)}</b> 元（${g25?SP(gr(gC,g25)):'去年無'}）${Math.abs(p25-g25)>1?`<br><span class="warn-t">⚠ 去年損益表 ${Y(p25)} 元 ≠ 去年傳票 ${Y(g25)} 元</span>`:''}</p>
     ${nw.length?`<p class="muted">比較為同店：已排除 ${nw.map(e=>ENT[e]).join('、')}（${nw.some(isMerged)?`${MERGE_Y}/9–10 併入，去年同期不在公司`:'不可比'}）；這些單位今年 ${Y(gv-gC)} 元不計入差額。</p>`:''}
     <h3 class="mt">差異來源｜依廠商／對象</h3>${diffTable(glDiff(exC,ex25c,x=>x.v).slice(0,10),'廠商／對象')}
     <h3 class="mt">差異來源｜依摘要（去掉月份字樣）</h3>${diffTable(glDiff(exC,ex25c,x=>normS(x.s)).slice(0,10),'摘要')}</div>`:'';
  const seg=`<div class="seg mt" id="rawy"><button data-y="2026" class="${RAWY===2026?'on':''}">今年傳票（${ex.length}）</button>${pyOK?`<button data-y="2025" class="${RAWY===2025?'on':''}">去年同期傳票（${ex25.length}）</button>`:''}</div>`;
  const list=RAWY===2025&&pyOK?ex25:ex;
  if(!ex.length&&!ex25.length){ const e=ents[0]; const src=ENT[e]===HQ?`服務部 工作表第 ${a.x} 列 − 各單位加總`:`26${String(m0).padStart(2,'0')} 工作表第 ${a.x-2} 列 ×「${ENT[e]}」欄`;
    return {sub:'',html:note+`<div class="card"><p><b>${esc(a.c)} ${esc(a.n)}</b>｜${ents.map(entName).join('、')}｜${m0===m1?m0+'月':m0+'–'+m1+'月'}</p><p class="num" style="font-size:22px;font-weight:650">${Y(pv)} 元</p><p class="muted">資料來源：${src}</p><p class="muted">傳票明細中沒有此科目 × 單位 × 月份的分錄（可能為分攤或公式計算數）。</p></div>`}; }
  return {sub:`來源：2601-08費用表${pyOK?'、2025費用表':''}（總帳傳票明細）｜依金額大小排序`,html:note+cmp+seg+`<div class="mt">${rawTable(list.slice(0,300))}</div>`+(list.length>300?'<div class="muted">僅顯示前 300 筆，完整清單請至「原始明細」</div>':''),
    after:()=>{ const sg=document.getElementById('rawy'); if(sg) sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{RAWY=+b.dataset.y; drawDrill();}); }};
}};}
function rawTable(ex){ return `<div class="tbl-wrap"><table><thead><tr><th>日期</th><th>傳票號碼</th><th>單位</th><th>會計科目</th><th>原始摘要</th><th>廠商／對象</th><th>AI 分類</th><th class="n">借方</th><th class="n">貸方</th><th class="n">淨額</th></tr></thead><tbody>${

function growthSource(cA){
  const ss=ssEnts(cA.ents,cA.m0,cA.m1), nw=cA.ents.filter(e=>!ss.includes(e)&&sumA(byCode['100'],{...cA,ents:[e]})>0), gone=cA.ents.filter(e=>!ss.includes(e)&&!nw.includes(e)&&sumA(byCode['100'],{...cA,ents:[e],py:true})>0);
  const f=(code,ents,py)=>sumA(byCode[code],{...cA,ents,py});
  return ['100','90','500'].map(code=>{ const p0=f(code,cA.ents,true), s0=f(code,ss,true), s1=f(code,ss,false), n1=f(code,nw,false), g0=f(code,gone,true), g1=f(code,gone,false);
    return {code,p0,s0,s1,ssD:s1-s0,ssG:gr(s1,s0),nw:n1,gone:g1-g0,t1:f(code,cA.ents,false)}; }).concat([{ss,nw,gone}]);
}

/* 12 問題答案 */

  const cT=pl(c);

  const drv=br.items.slice().sort((x,y)=>x.v-y.v); const neg=drv.filter(x=>x.v<0).slice(0,3), pos=drv.filter(x=>x.v>0).reverse().slice(0,3);
  const ms=monthStats(c); const avgOpm=cu.opm; const worstM=ms.slice().sort((x,y)=>(x.opm||0)-(y.opm||0))[0];
  const bs=branchStats(c).filter(x=>(c.entsAll||c.ents).includes(x.i)&&!x.closed&&!isBP(x.i));
  const bpS=branchStats(c).filter(x=>(c.entsAll||c.ents).includes(x.i)&&isBP(x.i));
  const worstB=bs.slice().sort((x,y)=>(x.opm||0)-(y.opm||0))[0];
  const decl=bs.filter(x=>x.g.op!=null).sort((x,y)=>x.g.op-y.g.op)[0];
  const ad=acctDeltas(c,b)[0];
  const cats=CATS.map(k=>({k,v:catV(k,c)})).sort((x,y)=>y.v-x.v);
  const ex=PROMO.filter(x=>x.m>=c.m0&&x.m<=c.m1&&c.ents.includes(x.e));
  const gross=ex.filter(x=>x.a>0).reduce((s,x)=>s+x.a,0), offset=ex.filter(x=>x.a<0).reduce((s,x)=>s+x.a,0);
  const cls={}; ex.filter(x=>x.a>0).forEach(x=>cls[x.c2]=(cls[x.c2]||0)+x.a); const topCls=Object.entries(cls).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const an=anomalies(c); const fake=bs.filter(x=>x.g.rev>0&&x.g.op<0);
  const closed=branchStats(c).filter(x=>x.closed&&(c.entsAll||c.ents).includes(x.i));
  const src=topSources(c,1)[0];
  const up=cu.op>=ba.op;
  return [
   {q:'今年到底賺多少？',a:`${perLabel(c)}（全部單位）零服業務貢獻(邊貢) <b>${Wu(cT.contrib)}</b>（邊貢率 <b>${P(cT.cr)}</b>）；營業利益 <b>${Wu(cT.op)}</b>，利益率 ${P(cT.opm)}；稅前淨利 ${Wu(cT.pbt)}。${c.ss?`<br><span class="muted">以下「比去年」為同店：邊貢率 ${P(cu.cr)} vs 去年 ${P(ba.cr)}</span>`:''}`},
   {q:`比${bl}${c.ss?'（同店）':''}多賺還是少賺？`,a:`<b class="${up?'good-t':'bad-t'}">${up?'多賺':'少賺'}</b>（${bl} ${Wu(ba.op)}）。${c.ss?'<span class="muted">（同店）</span>':''}`},
   {q:'差異多少？',a:`營業利益 <b>${SW(cu.op-ba.op)} 萬</b>（${SP(gr(cu.op,ba.op))}）；零服業務貢獻(邊貢) <b>${SW(cu.contrib-ba.contrib)} 萬</b>（${SP(gr(cu.contrib,ba.contrib))}）；營收 ${SP(gr(cu.rev,ba.rev))}、費用 ${SP(gr(cu.exp,ba.exp))}。`},
   {q:'為什麼？',a:`拉低：${neg.map(x=>`${x.n} ${SW(x.v)}萬`).join('、')||'無'}；推升：${pos.map(x=>`${x.n} ${SW(x.v)}萬`).join('、')||'無'}。`},
   {q:'哪個月份造成？',a:worstM?`<b>${worstM.m}月</b> 利益率最低 ${P(worstM.opm)}（期間平均 ${P(avgOpm)}），營業利益 ${Wu(worstM.op)}；業務貢獻率(邊貢率) ${P(worstM.cr)}（期間平均 ${P(cu.cr)}）。`:'—'},
   {q:'哪個廠造成？',a:worstB?`業務貢獻率(邊貢率)最低：<b>${bs.slice().sort((x,y)=>(x.cr||0)-(y.cr||0))[0].b}廠</b> ${P(bs.slice().sort((x,y)=>(x.cr||0)-(y.cr||0))[0].cr)}；利益率最低：<b>${bn(worstB.b)}</b> ${P(worstB.opm)}（利益 ${Wu(worstB.op)}）${decl?`；利益下滑最多：<b>${bn(decl.b)}</b> ${SP(decl.g.op)}（${decl.basis}）`:''}。${closed.length?`<br><span class="warn-t">⚠ ${closed.map(x=>bn(x.b)).join('、')} 最後一個月營收接近 0（疑似撤廠／停業，已排除於排名）</span>`:''}${bpS.length?`<br><span class="muted">鈑噴中心另列（不與服務廠排名）：${bpS.map(x=>`${x.b} 營業利益 ${Wu(x.op)}、業務貢獻(邊貢) ${Wu(x.contrib)}`).join('；')}</span>`:''}`:'—'},

   {q:'哪些支出異常？',a:`共 ${an.length} 項（門檻 20%／10萬）。前三：${an.slice(0,3).map(x=>`${x.m?x.m+'月 ':''}${entName(x.e)} ${x.a?esc(x.a.n):x.t} ${SW(x.d)}萬`).join('；')||'無'}。<a onclick="S.page='radar';render()">→ 異常雷達</a>`},
   {q:'哪些廠「營收看起來很好，但其實沒賺到錢」？',a:fake.length?fake.map(x=>`<b>${x.b}</b>${bpTag(x.i)}（營收 ${SP(x.g.rev)}、利益 ${SP(x.g.op)}）`).join('、')+`<span class="muted">｜${fake[0].basis}</span>`:'本期沒有「營收成長但利益下滑」的廠。'},
   {q:'下一步主管應該處理什麼？',a:actions(c).today[0]||'—'},
  ];

function actions(c){
  const {b}=effBase(c); const br=bridge(c,b); const neg=br.items.filter(x=>x.v<0).sort((x,y)=>x.v-y.v);
  const src=topSources(c,3); const an=anomalies(c).slice(0,3);
  const bs=branchStats(c).filter(x=>(c.entsAll||c.ents).includes(x.i)&&!x.closed&&!isBP(x.i)); const avgEr=wavg(bs,'exp');
  const hi=bs.filter(x=>x.er>avgEr).sort((x,y)=>(y.er-avgEr)*y.rev-(x.er-avgEr)*x.rev).slice(0,3);
  const today=[], month=[], next=[];
  if(src[0]) today.push(`先查 <b>${src[0].m}月 ${entName(src[0].e)}「${esc(src[0].a.n)}」${Wu(src[0].v)}</b>，比該廠月均高 ${SW(src[0].d)} 萬：確認是一次性（年終／獎勵／維修）還是常態。`);
  an.forEach(x=>{ if(today.length<3) today.push(`核對「${x.t}」：${x.m?x.m+'月 ':''}${entName(x.e)} ${x.a?esc(x.a.n):''} ${SW(x.d)} 萬（${x.why}）。`); });
  neg.slice(0,2).forEach(x=>month.push(`「${x.n}」拉低利益 ${SW(x.v)} 萬：本月訂出負責人與上限，逐項對照 ${BASE_LABEL[b]}。`));
  hi.forEach(x=>month.push(`${bn(x.b)} 費用率 ${P(x.er)} 高於廠平均 ${P(avgEr)}；若降到平均，可多 ${Wu((x.er-avgEr)*x.rev)} 利益。`));
  next.push(`下月追蹤：保養優惠券 61179910 每月淨額（本期 ${Wu(V('61179910',c))}）與遞延收益沖回是否同步；各項活動費 61179918 依廠商（祥碩／翊盛／裕日）核對請款月份。`);
  if(bs.length) next.push(`追蹤利益率最低 3 廠：${bs.slice().sort((x,y)=>(x.opm||0)-(y.opm||0)).slice(0,3).map(x=>`${x.b} ${P(x.opm)}`).join('、')}，每月檢討營收／毛利率／人事三項。`);
  return {today,month,next};
}

const BRTABS=[['ov','總覽排行'],['card','各廠體質卡'],['gap','差異拆解'],['struct','損益結構'],['kpi','營運效率'],['trend','月別趨勢'],['vs','兩廠對標'],['pot','改善潛力'],['grp','管理分群']];
let BRTAB='ov', VSA=null, VSB=null, BTRM='cr';
const GAPI=[['gm','毛利率','120',1],['bon','原廠補助','130',1],['ext','外促（廣促）','140',-1],['int','內促（績效獎金）','150',-1],['fix','固定薪資','160',-1],
  ['asset','資產使用（租金／折舊／修繕）','49010',-1],['ind','間接人事','49020',-1],['adm','事務費用','49030',-1],['peri','週邊業務','170',1]];
const kpiSum=(k,e,c)=>{ const K=c.py?D.kpi[k].py:D.kpi[k]; return e===HQI||!K?0:K.br[e].slice(c.m0-1,c.m1).reduce((a,b)=>a+b,0); };
function plantRow(i,c){
  const cc={...c,ents:[i]}; const p=pl(cc); const r=p.rev||0;
  const o={i,b:BR[i],bp:isBP(i),rev:r,gp:p.gp,contrib:p.contrib,op:p.op,exp:p.exp,gm:p.gm,cr:p.cr,opm:p.opm,er:p.er};
  GAPI.forEach(([k,,code,sg])=>{ o['r_'+k]=r?(k==='gm'?p.gm:V(code,cc)/r):null; });
  o.cars=kpiSum('保修進廠台數',i,c); o.paid=kpiSum('有費台數(不含補償)',i,c); o.comp=kpiSum('補償台數',i,c);
  o.hm=kpiSum('服務廠人數',i,c); o.dm=kpiSum('服務廠直接人數',i,c);
  o.perCar=o.cars?r/o.cars:null; o.perHead=o.hm?r/o.hm:null; o.perTech=o.dm?r/o.dm:null; o.contribHead=o.hm?p.contrib/o.hm:null;
  o.labor=r?V('4111',cc)/r:null; const pr=V('410801',cc); o.partGM=pr?1-V('510201',cc)/pr:null;
  o.compR=r?(V('410802',cc)+V('411102',cc))/r:null; o.hrR=r?(V('150',cc)+V('160',cc))/r:null; o.rentR=r?V('4901010',cc)/r:null;
  const gp=growthPair(cc); if(gp){ const a=pl(gp.cur), z=pl(gp.base); o.gRev=gr(a.rev,z.rev); o.gCon=gr(a.contrib,z.contrib); o.dCr=(a.cr||0)-(z.cr||0); o.gLabel=gp.label; }
  const last=V('100',{...cc,m0:c.m1,m1:c.m1}), avgm=V('100',{...cc,m0:1,m1:NM})/NM; o.closed=last<avgm*0.1;
  return o;
}
function plantSet(c){
  const rows=BR.map((_,i)=>plantRow(i,c)).filter(x=>(c.entsAll||c.ents).includes(x.i));
  const sv=rows.filter(x=>!x.bp&&!x.closed);
  const sum=k=>sv.reduce((t,x)=>t+(x[k]||0),0); const R=sum('rev');
  const avg={rev:R/(sv.length||1),gm:sum('gp')/R,cr:sum('contrib')/R,opm:sum('op')/R,er:sum('exp')/R};
  GAPI.forEach(([k,,code])=>{ avg['r_'+k]=k==='gm'?avg.gm:sv.reduce((t,x)=>t+x['r_'+k]*x.rev,0)/R; });
  ['perCar','perHead','perTech','contribHead','labor','partGM','compR','hrR','rentR'].forEach(k=>{ const f=sv.filter(x=>x[k]!=null); avg[k]=f.reduce((t,x)=>t+x[k],0)/(f.length||1); });
  const cars=sum('cars'), hm=sum('hm'), dm=sum('dm'); avg.perCar=cars?R/cars:null; avg.perHead=hm?R/hm:null; avg.perTech=dm?R/dm:null; avg.contribHead=hm?sum('contrib')/hm:null;
  // 綜合分數（z 分數加權）
  const z=(k,dir=1)=>{ const v=sv.map(x=>x[k]).filter(v=>v!=null&&isFinite(v)); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1; return x=>x[k]==null?0:dir*(x[k]-m)/sd; };
  const W_=[[z('cr'),.35],[z('opm'),.2],[z('perHead'),.15],[z('gCon'),.15],[z('er',-1),.15]];
  sv.forEach(x=>x.score=W_.reduce((t,[f,w])=>t+f(x)*w,0));
  const ord=sv.slice().sort((a,b)=>b.score-a.score); ord.forEach((x,k)=>{ x.rank=k+1; x.grade=k<Math.ceil(ord.length*.25)?'A':k<Math.ceil(ord.length*.5)?'B':k<Math.ceil(ord.length*.75)?'C':'D'; });
  rows.forEach(x=>{ x.gap={}; GAPI.forEach(([k,,code,sg])=>{ x.gap[k]=x['r_'+k]==null?null:sg*(x['r_'+k]-avg['r_'+k]); }); });
  return {rows,sv,avg,ord};
}
const gradeTag=g=>g?`<span class="tag ${g==='A'?'good':g==='D'?'bad':g==='C'?'warn':'neu'}" style="font-size:13px">${g}</span>`:'';
const ppC=v=>v==null?'—':`<span class="${v>=0?'good-t':'bad-t'}">${(v>=0?'+':'')+(v*100).toFixed(1)}</span>`;
function plantStrengths(x,avg){
  const items=GAPI.map(([k,n])=>({n,v:x.gap[k]})).filter(o=>o.v!=null);
  const pos=items.filter(o=>o.v>0.005).sort((a,b)=>b.v-a.v).slice(0,2), neg=items.filter(o=>o.v<-0.005).sort((a,b)=>a.v-b.v).slice(0,2);
  return {pos,neg};
}
function branchSummary(S_,c){
  const {sv,avg,ord}=S_; if(!sv.length) return '';

  const best=sv.slice().sort((a,b)=>b.cr-a.cr)[0], worst=sv.slice().sort((a,b)=>a.cr-b.cr)[0];
  const up=sv.filter(x=>x.gCon>0.03).map(x=>x.b), down=sv.filter(x=>x.gCon<-0.03).map(x=>x.b);
  return `<div class="card ai"><h2 style="color:var(--accent)">各廠狀況總評</h2>

   <p>綜合評分第一：<b>${hi.b}</b>（邊貢率 ${P(hi.cr)}、人均營收 ${W(hi.perHead)} 萬／人月）；最後：<b>${lo.b}</b>（邊貢率 ${P(lo.cr)}、人均營收 ${W(lo.perHead)} 萬／人月）。</p>
   <p>各廠「差在哪裡」：差異最大的前三項是 <b>${disp.slice(0,3).map(x=>x.n).join('、')}</b>（以占營收比率的離散程度衡量）——管理上應優先統一這幾項。</p>
   <p>${sv[0]&&sv[0].gLabel?`動能（${sv[0].gLabel} 邊貢）：成長 ${up.length?up.join('、'):'無'}；轉弱 ${down.length?`<span class="bad-t">${down.join('、')}</span>`:'無'}。`:''}</p>
   <p class="muted">評分＝邊貢率 35% + 營業利益率 20% + 人均營收 15% + 邊貢 YoY 15% + 費用率（反向）15%，以各廠 z 分數加權；A＝前 25%，D＝後 25%。鈑噴中心與停業廠不評分。</p></div>`;
}

/* 改善潛力 */
BRP.pot=(el,c,S_)=>{
  const {sv,avg}=S_; const items=GAPI.filter(([k])=>k!=='peri');
  const top=k=>{ const v=sv.map(x=>x['r_'+k]).filter(v=>v!=null).sort((a,b)=>a-b); const sg=GAPI.find(g=>g[0]===k)[3]; return sg>0?v[Math.floor(v.length*.75)]:v[Math.floor(v.length*.25)]; };
  const rows=sv.map(x=>{ const o={x,toAvg:0,toTop:0,det:[]}; items.forEach(([k,n,,sg])=>{ const r=x['r_'+k]; if(r==null) return; const ga=sg*(avg['r_'+k]-r)*x.rev, gt=sg*(top(k)-r)*x.rev; if(ga>0){o.toAvg+=ga; o.det.push({n,v:ga});} if(gt>0) o.toTop+=gt; }); o.det.sort((a,b)=>b.v-a.v); return o; }).sort((a,b)=>b.toAvg-a.toAvg);

function branchDiag(i,c){
  const cAll=ctx({ents:SVCI,m0:c.m0,m1:c.m1}); const p=pl(c), pa=pl(cAll);
  const bs=branchStats(c.m0===undefined?ctx():ctx({m0:c.m0,m1:c.m1})); const me=bs[i];
  const SV=bs.filter(x=>!x.closed&&!isBP(x.i)); const rank=SV.slice().sort((a,b)=>b.opm-a.opm).findIndex(x=>x.i===i)+1;
  const leafs=EXP_LEAVES.map(o=>{const a=A[o.id]; const v=sumA(a,c); const avgR=ratio(sumA(a,cAll),pa.rev)||0; return {a,v,ex:v-avgR*p.rev,r:ratio(v,p.rev),avgR};});
  const over=leafs.filter(x=>x.ex>0).sort((x,y)=>y.ex-x.ex), under=leafs.filter(x=>x.ex<0).sort((x,y)=>x.ex-y.ex);
  const gmEff=((p.gm||0)-(pa.gm||0))*p.rev;
  const bonusEff=V('130',c)-ratio(V('130',cAll),pa.rev)*p.rev;
  const posF=[{n:'毛利率',v:gmEff,t:`毛利率 ${P(p.gm)} vs 廠平均 ${P(pa.gm)}`},{n:'原廠補助',v:bonusEff,t:`零服獎金占營收 ${P(ratio(V('130',c),p.rev))}`},...under.slice(0,2).map(x=>({n:x.a.n,v:-x.ex,t:`占營收 ${P(x.r)} vs 平均 ${P(x.avgR)}`}))].sort((a,b)=>b.v-a.v);
  const negF=[{n:'毛利率',v:-gmEff,t:`毛利率 ${P(p.gm)} vs 廠平均 ${P(pa.gm)}`},...over.slice(0,3).map(x=>({n:x.a.n,v:x.ex,t:`占營收 ${P(x.r)} vs 平均 ${P(x.avgR)}`}))].sort((a,b)=>b.v-a.v);
  const an=anomalies(c).slice(0,3); const src=topSources(c,1)[0];
  const status=me.closed?`⚠ ${bn(me.b)} ${c.m1}月營收 ${Wu(V('100',{...c,m0:c.m1,m1:c.m1}))}，接近 0，資料顯示已停業／撤廠（摘要中亦有「撤廠通知DC費用」）。`:`營收 ${Wu(p.rev)}，零服業務貢獻(邊貢) ${Wu(p.contrib)}（業務貢獻率(邊貢率) ${P(p.cr)}，${isBP(i)?'鈑噴中心，不參與服務廠排名':`${SV.length} 個服務廠第 ${SV.slice().sort((a,b)=>b.cr-a.cr).findIndex(x=>x.i===i)+1} 名`}；服務廠平均 ${P(pa.cr)}），營業利益 ${Wu(p.op)}（利益率 ${P(p.opm)}，${isBP(i)?'':`服務廠第 ${rank} 名；`}服務廠平均 ${P(pa.opm)}）。費用率 ${P(p.er)}（平均 ${P(pa.er)}）。${me.g.op!=null?`趨勢：${me.basis} 營收 ${SP(me.g.rev)}、業務貢獻(邊貢) ${SP(me.g.contrib)}、利益 ${SP(me.g.op)}。`:''}`;
  const pos=posF[0], neg=negF[0];
  return `<h4>目前狀況</h4><p>${status}</p>
   <h4>最大正向因素</h4><p>${pos&&pos.v>0?`<b>${esc(pos.n)}</b>：相對廠平均多貢獻 ${Wu(pos.v)}（${pos.t}）`:'無明顯優於平均的項目'}</p>
   <h4>最大負向因素</h4><p>${neg&&neg.v>0?`<b>${esc(neg.n)}</b>：相對廠平均多吃掉 ${Wu(neg.v)}（${neg.t}）`:'無明顯劣於平均的項目'}</p>
   <h4>主要異常</h4><ul>${an.map(x=>`<li>${x.m?x.m+'月 ':''}${x.a?esc(x.a.n):x.t}：${SW(x.d)} 萬（${x.why}）</li>`).join('')||'<li>無（門檻 20%／10 萬）</li>'}</ul>
   <h4>Root Cause</h4><p>${neg&&neg.v>0?`利益落差主要來自「${esc(neg.n)}」${negF[1]&&negF[1].v>0?`與「${esc(negF[1].n)}」`:''}；${src?`單點最大是 ${src.m}月「${esc(src.a.n)}」${Wu(src.v)}（高於該廠月均 ${SW(src.d)} 萬）。`:''}`:'結構與廠平均相近，差異主要來自營收規模。'}</p>
   <h4>建議主管優先處理事項</h4><ul>
    ${src?`<li><b>今天先查：</b>${src.m}月「${esc(src.a.n)}」${Wu(src.v)} 的傳票與原因。</li>`:''}
    ${over[0]?`<li><b>本月改善：</b>「${esc(over[0].a.n)}」占營收 ${P(over[0].r)}，平均 ${P(over[0].avgR)}；降到平均可省 ${Wu(over[0].ex)}。</li>`:''}
    <li><b>下月追蹤：</b>${me.g.rev!=null?`營收動能 ${SP(me.g.rev)}、`:''}毛利率 ${P(p.gm)}、費用率 ${P(p.er)} 三項月報。</li></ul>`;
}

  const incs=acctDeltas(c,B1).slice(0,5);
  el.insertAdjacentHTML('beforeend',`<div class="grid g2 mt"><div class="card ai"><h2 style="color:var(--accent)">營收成長品質（vs ${BASE_LABEL[B1]}）</h2>

    <div class="muted">基準：${BASE_LABEL[B1]}；營收增量 ${SW(dRev)} 萬</div></div></div>`);

let CX={r:'b',c:'m',v:'amt',f:'exp'};
R.cross=el=>{

  const dims=[['m','月份'],['b','廠別'],['cat','費用大類'],['line','損益科目'],['t','費用科目（傳票）'],['cls','AI 分類'],['vend','廠商／對象']];

  ['cxr','cxc','cxv'].forEach(id=>document.getElementById(id).onchange=()=>{CX={r:cxr.value,c:cxc.value,v:cxv.value}; render();});
  const useExp=['t','cls','vend'].includes(CX.r)||['t','cls','vend'].includes(CX.c);
  const keys=d=>{ if(d==='m') return months(c).map(m=>({k:m,l:m+'月'})); if(d==='b') return c.ents.map(e=>({k:e,l:ENT[e]}));
    if(d==='cat') return CATS.map(k=>({k:k.k,l:k.n})); if(d==='line') return LINES.map(l=>({k:l.k,l:l.n}));
    const f={t:'t',cls:'c1',vend:'v'}[d]; const agg={}; D.exp.forEach(x=>{ if(x.m<c.m0||x.m>c.m1||!c.ents.includes(x.e)||!isExpRow(x)) return; const k=x[f]||'（未標示）'; agg[k]=(agg[k]||0)+x.a; });
    return Object.entries(agg).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,20).map(([k])=>({k,l:k})); };
  const rk=keys(CX.r), ck=keys(CX.c);
  const cell=(r,col,cc0)=>{ const cc={...c}; const dims={}; dims[CX.r]=r; dims[CX.c]=col;
    if('m' in dims){cc.m0=cc.m1=dims.m;} if('b' in dims) cc.ents=[dims.b];
    if(useExp){ if('line' in dims) return {v:null,cc}; const fx=D.exp.filter(x=>x.m>=cc.m0&&x.m<=cc.m1&&cc.ents.includes(x.e)&&isExpRow(x)&&(!('t' in dims)||x.t===dims.t)&&(!('cls' in dims)||x.c1===dims.cls)&&(!('vend' in dims)||(x.v||'（未標示）')===dims.vend)&&(!('cat' in dims)||catOfRow(x).k===dims.cat)); return {v:fx.reduce((s,x)=>s+x.a,0),cc}; }
    let v; if('cat' in dims&&'line' in dims) v=null; else if('cat' in dims) v=catV(CATS.find(x=>x.k===dims.cat),cc); else if('line' in dims) v=V(LINES.find(l=>l.k===dims.line).c,cc); else v=expTot(cc);
    return {v,cc}; };
  const M=rk.map(r=>ck.map(col=>{ const {v,cc}=cell(r.k,col.k); if(v==null) return null;
    if(CX.v==='er') return ratio(v,V('100',cc)); if(CX.v==='mom'){ if(cc.m0!==cc.m1||cc.m0===1) return null; const pv=cell(r.k,col.k,1); const cp={...cc,m0:cc.m0-1,m1:cc.m0-1}; return null; } return v; }));
  let Mv=M;
  if(CX.v==='mom'&&(CX.r==='m'||CX.c==='m')){ Mv=rk.map((r,i)=>ck.map((col,j)=>{ const cur=M[i][j]; const m=CX.r==='m'?r.k:col.k; if(m===1) return null; const prevR=CX.r==='m'?rk.findIndex(x=>x.k===m-1):i, prevC=CX.c==='m'?ck.findIndex(x=>x.k===m-1):j; if(prevR<0||prevC<0) return null; const {v:pv}=cell(CX.r==='m'?m-1:r.k,CX.c==='m'?m-1:col.k); const {v:cv}=cell(r.k,col.k); return gr(cv,pv); })); }
  else if(CX.v==='mom'){ document.getElementById('cxt').innerHTML='<div class="muted">月增率需要把「月份」放在列或欄。</div>'; return; }
  const tot=M.flat().filter(x=>x!=null).reduce((s,x)=>s+x,0);
  const disp=(v)=>v==null?'—':CX.v==='amt'?W(v):CX.v==='share'?P(v/tot):P(v);
  const allv=Mv.flat().filter(x=>x!=null&&isFinite(x)).map(x=>CX.v==='share'?x/tot:x); const mx=Math.max(...allv.map(Math.abs),1e-9);
  const bg=v=>{ if(v==null||!isFinite(v)) return ''; const x=(CX.v==='share'?v/tot:v)/mx; return `background:color-mix(in srgb, ${x<0?'var(--div-pos)':'var(--accent)'} ${Math.round(Math.abs(x)*55)}%, transparent)`; };
  document.getElementById('cxt').innerHTML=`<table class="heat"><thead><tr><th></th>${ck.map(x=>`<th class="n">${esc(x.l)}</th>`).join('')}<th class="n">合計</th></tr></thead><tbody>${rk.map((r,i)=>{ const rs=M[i].filter(x=>x!=null).reduce((s,x)=>s+x,0); return `<tr><td><b>${esc(r.l)}</b></td>${Mv[i].map(v=>`<td class="n" style="${bg(v)}">${disp(v)}</td>`).join('')}<td class="n"><b>${CX.v==='amt'||CX.v==='share'?disp(rs):''}</b></td></tr>`;}).join('')}</tbody></table><div class="muted">${CX.v==='amt'?'萬元':''}</div>`;
};

function hrAnswers(c){
  const {b}=effBase(c); const bl=BASE_LABEL[b]+(c.ss?'（同店）':''); const pT=hrPack(c); const p=hrPack(cmpC(c)), q=hrPackB(c,b);

  const incB=bs.slice().sort((x,y)=>y.g.dtot-x.g.dtot)[0];

  const gap=bs.filter(x=>x.g.tot>0&&(x.g.op<0||x.g.rev<x.g.tot));
  const imp=bs.filter(x=>x.g.rate<0&&x.g.eff>0).sort((x,y)=>y.g.eff-x.g.eff);
  const cor=hrKpiCorr(c,false).filter(x=>x.r!=null&&x.r>=.6).sort((x,y)=>y.r-x.r);

   [`比${bl}多多少？`,`合計 ${SW(p.tot-q.tot)} 萬（${SP(gr(p.tot,q.tot))}）：固定薪 ${SW(p.fix-q.fix)} 萬、獎金 ${SW(p.bon-q.bon)} 萬。`],
   ['哪個廠增加最多？',incB?`<b>${bn(incB.b)}</b> ${SW(incB.g.dtot)} 萬（${SP(incB.g.tot)}）<span class="muted">｜${lab}</span>`:'—'],
   ['哪個月份增加最多？',ms?`<b>${ms.m}月</b> 較上月 ${SW(ms.d)} 萬（固定薪 ${SW(ms.df)}、獎金 ${SW(ms.db)}）`:'—'],
   ['人事成本增加後營收有沒有增加？',yn('rev')],['毛利有沒有增加？',yn('gp')+`<br>零服業務貢獻(邊貢)：${yn('contrib')}，業務貢獻率(邊貢率) ${P(p.cr)} vs ${P(q.cr)}`],['營業利益有沒有增加？',yn('op')],
   ['哪些廠人事投入增加但產出沒有同步增加？',gap.length?gap.map(x=>`${x.b}（人事 ${SP(x.g.tot)}／營收 ${SP(x.g.rev)}／利益 ${SP(x.g.op)}）`).join('、')+`<span class="muted">｜${lab}</span>`:'無'],
   ['哪些廠的人事投入產出效率正在改善？',imp.length?imp.slice(0,5).map(x=>`${x.b}（人事投入率 ${pp(x.g.rate)}、每$1利益 ${SP(x.g.eff)}）`).join('、'):'無'],
   ['內促獎金與哪些服務 KPI 同步變化？',cor.length?cor.slice(0,4).map(x=>`${x.k[1]} r=${x.r.toFixed(2)}`).join('、')+'<span class="muted">｜月別相關係數，受 2 月春節影響，相關≠因果</span>':'無 r≥0.6 的指標'],
   ['下一步主管應優先檢查？',pr?`<b>${pr.m}月 ${entName(pr.e)} ${HRK[pr.key].n}</b> ${Wu(pr.v)}，高於該單位月均 ${SW(pr.d)} 萬。`:'—']];
}

function nodeHrMonths(k){ return {title:`${HRK[k].n}｜月份`,build(){ const c=ctx(); const vals=months(c).map(m=>({m,v:hv(k,{...c,m0:m,m1:m})})); const avg=vals.reduce((s,x)=>s+x.v,0)/vals.length;

function nodeHrSplit(ents,m0,m1){ return {title:`${ents.length===1?entName(ents[0]):ents.length+'單位'}｜固定薪／內促獎金`,build(){ const c=ctx({ents,m0,m1});

    <div class="muted">「量能代理」＝以該作業的成本科目代表作業量；Excel 無高單台、來電成交率、工時資料。</div></div>
   <div class="card"><h2>內促獎金 vs ${sel.k[1]}｜各月</h2><div class="chart" id="hk1"></div><h3 class="mt">廠別橫向：每人內促獎金 vs</h3><table><tbody>${cr.map(x=>`<tr><td>${x.n}</td><td>${rTxt(x.r)}</td></tr>`).join('')}</tbody></table><div class="muted">${hrBranches(c).filter(x=>!x.closed&&x.hm>0).length} 廠比較（排除停業廠）</div></div></div>`);
  document.getElementById('hx2').onchange=e=>{HRX2=e.target.checked; render();};
  el.querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{HRKPI=tr.dataset.k; render();});
  mkChart('hk1',{grid:{left:60,right:20,top:20,bottom:40},tooltip:{trigger:'item',formatter:x=>`${sel.ms[x.dataIndex]}月<br>獎金 ${Wu(x.value[0])}<br>${sel.k[1]} ${sel.k[3]?Y(x.value[1])+' '+sel.k[3]:Wu(x.value[1])}`},
    xAxis:{type:'value',name:'內促獎金',nameLocation:'middle',nameGap:26,scale:true,axisLabel:{formatter:v=>W(v)}},yAxis:{type:'value',scale:true,axisLabel:{formatter:v=>sel.k[3]?Y(v):W(v)}},
    series:[{type:'scatter',symbolSize:12,data:sel.bon.map((v,i)=>[v,sel.y[i]]),label:{show:true,position:'right',formatter:x=>sel.ms[x.dataIndex]+'月',fontSize:10,color:css('--ink-3')},itemStyle:{borderColor:css('--surface'),borderWidth:2}}]});
};
HRP.wf=(el,c,b,bl)=>{
  const p=hrPack(cmpC(c)), q=hrPackB(c,b);
  el.insertAdjacentHTML('beforeend',`<div class="grid g2"><div class="card"><h2>人事成本 Waterfall</h2><div class="chart tall" id="hw1"></div></div><div class="card"><h2>營業利益 Waterfall</h2><div class="chart tall" id="hw2"></div></div></div><div class="card mt" id="hwd"><div class="muted">點任一柱看會計科目差異。</div></div>`);
  const draw=(id,start,items,end,sl,el2)=>{ let run=start; const base=[0],upv=[start],pos=[null],neg=[null]; items.forEach(x=>{base.push(Math.min(run,run+x.v)); if(x.v>=0){pos.push(x.v);neg.push(null);}else{neg.push(-x.v);pos.push(null);} upv.push(null); run+=x.v;}); base.push(0); upv.push(end); pos.push(null); neg.push(null);
    const cats=[sl,...items.map(x=>x.n),el2];
    const ch=mkChart(id,{grid:{left:60,right:14,top:24,bottom:70},tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:t=>{const i=t[0].dataIndex; return i===0?`${sl}<br>${Wu(start)}`:i===cats.length-1?`${el2}<br>${Wu(end)}`:`${items[i-1].n}<br>${SW(items[i-1].v)} 萬`;}},
      xAxis:{type:'category',data:cats,axisLabel:{rotate:30,interval:0,fontSize:11}},yAxis:wanAxis,
      series:[{type:'bar',stack:'w',itemStyle:{color:'transparent'},data:base},{type:'bar',stack:'w',color:css('--s1'),itemStyle:{borderRadius:[4,4,0,0]},data:upv,label:{show:true,position:'top',fontSize:10,formatter:t=>t.value?W(t.value):''}},
        {type:'bar',stack:'w',color:css(id==='hw1'?'--s8':'--s3'),data:pos,label:{show:true,position:'top',fontSize:10,color:css('--ink-2'),formatter:t=>t.value?'+'+W(t.value):''}},{type:'bar',stack:'w',color:css(id==='hw1'?'--s3':'--s8'),data:neg,label:{show:true,position:'bottom',fontSize:10,color:css('--ink-2'),formatter:t=>t.value?'−'+W(t.value):''}}]});
    ch&&ch.on('click',t=>{const it=items[t.dataIndex-1]; if(it&&it.codes) hrWfDetail(it,c,b);}); };
  draw('hw1',q.hr,[{n:'固定薪',v:p.fix-q.fix,codes:['160']},{n:'內促獎金',v:p.bon-q.bon,codes:['150']},{n:'其他人事（間接）',v:p.oth-q.oth,codes:['49020']}],p.hr,bl+' 人事成本','今年人事成本');
  const gmB=q.gm||0; const it=[{n:'營收變化',v:(p.rev-q.rev)*gmB,codes:['100']},{n:'毛利率變化',v:p.rev*((p.gm||0)-gmB),codes:['110']},{n:'固定薪',v:-(p.fix-q.fix),codes:['160']},{n:'內促獎金',v:-(p.bon-q.bon),codes:['150']}];
  it.push({n:'其他費用／收入',v:(p.op-q.op)-it.reduce((s,x)=>s+x.v,0),codes:['130','140','49010','49020','49030','170']});
  draw('hw2',q.op,it,p.op,bl+' 營業利益','今年營業利益');
  document.getElementById('hwd').insertAdjacentHTML('afterbegin',`<p><b>固定薪</b>變化對營業利益影響 ${SW(-(p.fix-q.fix))} 萬；<b>內促獎金</b>影響 ${SW(-(p.bon-q.bon))} 萬；同期營收變化貢獻 ${SW((p.rev-q.rev)*gmB)} 萬。</p>`);
  if(!c.all&&b==='avg') document.getElementById('hwd').insertAdjacentHTML('afterbegin','<div class="banner warn">基準為「服務廠平均」：差異同時包含廠規模大小的影響，建議搭配「上期」基準判讀。</div>');
};
function hrWfDetail(it,c,b){ const list=[]; it.codes.forEach(code=>{const a=byCode[code]; if(!a) return; leaves(a.id).forEach(id=>{const cu=sumA(A[id],c), ba=baseA(A[id],c,b); if(cu||ba) list.push({a:A[id],cu,ba,d:cu-ba});});}); list.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  document.getElementById('hwd').innerHTML=`<h2>${it.n}</h2><div class="tbl-wrap"><table><thead><tr><th>科目</th><th class="n">本期</th><th class="n">基準</th><th class="n">差額</th></tr></thead><tbody>${list.slice(0,15).map(x=>`<tr class="click" data-id="${x.a.id}"><td>${esc(x.a.n)}</td><td class="n">${W(x.cu)}</td><td class="n">${W(x.ba)}</td><td class="n">${SW(x.d)}</td></tr>`).join('')}</tbody></table></div><div class="muted">萬元｜點科目往下追</div>`;
  document.querySelectorAll('#hwd tr[data-id]').forEach(tr=>tr.onclick=()=>openDrill(nodeAcct(+tr.dataset.id,c.ents,c.m0,c.m1))); }
HRP.ai=(el,c,b,bl)=>{
  el.insertAdjacentHTML('beforeend',`<div class="card ai">${hrDiag(c)}</div><div class="card mt"><h2>各廠人事成本診斷</h2><div class="seg" id="hrab" style="flex-wrap:wrap">${BR.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div><div id="hrao" class="ai mt"></div></div>`);
  const show=i=>{document.getElementById('hrao').innerHTML=`<h2>【${bn(BR[i])}】</h2>`+hrDiag(ctx({ents:[i]})); el.querySelectorAll('#hrab button').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));};
  el.querySelectorAll('#hrab button').forEach(x=>x.onclick=()=>show(+x.dataset.i)); show(c.ents.length===1&&c.ents[0]!==HQI?c.ents[0]:0);
};

/* init */
buildFilters(); render();
if(!window.echarts) document.getElementById('page').insertAdjacentHTML('afterbegin','<div class="banner warn">⚠ 圖表程式庫無法載入（需要網路連線到 cdnjs）。表格與分析仍可使用。</div>');
</script>
</body>
